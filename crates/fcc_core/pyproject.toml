[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "fcc-core"
version = "0.2.0"
description = "Optional Rust hot-path core for Free Claude Code (SHA-256, HMAC, validators, Bloom)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FCC contributors" }]
keywords = ["fcc", "rust", "pyo3", "hotpath", "hmac", "sha256"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
  "Topic :: System :: Networking",
]
urls = { Homepage = "https://github.com/NggKhaiz/FCC", Repository = "https://github.com/NggKhaiz/FCC" }

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "fcc_core"
features = ["python"]
